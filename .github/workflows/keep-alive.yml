name: keep-alive

# 目的：让 Supabase 免费项目保持活跃，避免「7 天无活动」被暂停。
# 只读查询经实测不能重置不活跃计时，所以这里必须产生一次真实写入：
# 往 lm_heartbeat 插一行（该表仅开放匿名插入，不能读、改、删）。

on:
  schedule:
    # 每周一、周四 03:17 UTC（北京时间 11:17），间隔 3~4 天，留足余量
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # publishable key 本身就是随前端公开下发的键，不含管理权限
      SUPABASE_KEY: sb_publishable_kYs0WWcvoDJIX-Fozjk2vg_tzwea2hl
      SUPABASE_URL: https://yvjlpyfuejgncsnswxae.supabase.co
    steps:
      - name: 读取检查
        run: |
          set -e
          echo "time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/lm_users?select=username&limit=1")
          echo "status: ${code}"
          echo "body: $(head -c 200 /tmp/body.txt)"
          if [ "${code}" -ge 400 ]; then
            echo "读取失败，请检查 key、接口地址，或项目是否被暂停"
            exit 1
          fi

      - name: 写入心跳
        run: |
          set -e
          code=$(curl -sS -o /tmp/hb.txt -w '%{http_code}' -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"ts\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}" \
            "${SUPABASE_URL}/rest/v1/lm_heartbeat")
          echo "status: ${code}"
          if [ "${code}" -ge 300 ]; then
            echo "写入失败：$(head -c 300 /tmp/hb.txt)"
            exit 1
          fi
          echo "ok"
